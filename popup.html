<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      width: 320px;
      margin: 0;
      font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
      background: #18181b;
      color: #efeff1;
    }
    header {
      padding: 12px 14px;
      font-size: 14px;
      font-weight: 700;
      border-bottom: 1px solid #2e2e33;
    }
    .section {
      padding: 12px 14px;
      border-bottom: 1px solid #2e2e33;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .row:last-child { margin-bottom: 0; }
    .row label { font-size: 13px; }
    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #9147ff;
      cursor: pointer;
    }
    input[type="range"] {
      width: 130px;
      accent-color: #9147ff;
    }
    select {
      background: #2e2e33;
      color: #efeff1;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 4px 6px;
      font-size: 12px;
    }
    #sizeValue {
      font-size: 12px;
      color: #adadb8;
      min-width: 38px;
      text-align: right;
    }
    input[type="text"], input[type="number"] {
      width: 100%;
      box-sizing: border-box;
      padding: 7px;
      margin-bottom: 8px;
      background: #2e2e33;
      border: 1px solid #444;
      border-radius: 4px;
      color: #efeff1;
      font-size: 12px;
    }
    button {
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 4px;
      background: #9147ff;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
    }
    button.secondary {
      background: #2e2e33;
      color: #efeff1;
    }
    #status {
      font-size: 11px;
      margin-top: 8px;
      color: #adadb8;
    }
    .legend {
      font-size: 11px;
      color: #adadb8;
      line-height: 1.7;
      padding: 10px 14px;
    }
    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 5px;
    }
    .band {
      display: grid;
      grid-template-columns: 88px 26px 62px 1fr;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      font-size: 12px;
    }
    .band:last-of-type { margin-bottom: 0; }
    .band input[type="color"] {
      width: 26px;
      height: 22px;
      padding: 0;
      border: 1px solid #444;
      border-radius: 4px;
      background: #2e2e33;
      cursor: pointer;
    }
    .band input[type="color"]::-webkit-color-swatch-wrapper { padding: 2px; }
    .band input[type="color"]::-webkit-color-swatch { border: none; border-radius: 2px; }
    .band input.hex {
      width: 62px;
      margin: 0;
      padding: 4px 5px;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 11px;
    }
    .band .until {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
      color: #adadb8;
      font-size: 11px;
      white-space: nowrap;
    }
    .band .until input[type="number"] { width: 46px; margin: 0; padding: 4px 5px; }
  </style>
</head>
<body>
  <header>Uptime Badges for Twitch</header>

  <div class="section">
    <div class="row">
      <label for="enabled">Show badges</label>
      <input type="checkbox" id="enabled" />
    </div>
    <div class="row">
      <label for="colors">Color by uptime</label>
      <input type="checkbox" id="colors" />
    </div>
    <div class="row">
      <label for="sidebar">Sidebar times</label>
      <input type="checkbox" id="sidebar" />
    </div>
    <div class="row">
      <label>Size</label>
      <div style="display:flex; align-items:center; gap:6px;">
        <input type="range" id="size" min="60" max="160" step="5" />
        <span id="sizeValue">100%</span>
      </div>
    </div>
    <div class="row">
      <label for="corner">Position</label>
      <select id="corner">
        <option value="bottom-right">Bottom right</option>
        <option value="bottom-left">Bottom left</option>
        <option value="top-right">Top right</option>
        <option value="top-left">Top left</option>
      </select>
    </div>
  </div>

  <div class="legend" id="legend">
    <div style="display:flex; align-items:center; justify-content:space-between;">
      <div>
        <span class="dot" id="dot0" style="background:#00e676"></span><span id="lgGreen">Under 2h</span> &nbsp;
        <span class="dot" id="dot1" style="background:#4fc3f7"></span><span id="lgBlue">2-5h</span><br />
        <span class="dot" id="dot2" style="background:#ffd740"></span><span id="lgYellow">5-8h</span> &nbsp;
        <span class="dot" id="dot3" style="background:#ff5252"></span><span id="lgRed">8h+</span>
      </div>
      <button id="optionsBtn" style="width:auto; padding:5px 10px; font-size:11px;" class="secondary">Options</button>
    </div>

    <div id="optionsPanel" style="display:none; margin-top:10px; border-top:1px solid #2e2e33; padding-top:10px;">
      <div class="band">
        <label for="c0"><span class="dot" id="pdot0"></span>Just started</label>
        <input type="color" id="c0" />
        <input type="text" class="hex" id="h0" maxlength="7" spellcheck="false" />
        <span class="until">until <input type="number" id="t1" min="0.5" step="0.5" /> h</span>
      </div>
      <div class="band">
        <label for="c1"><span class="dot" id="pdot1"></span>Settled in</label>
        <input type="color" id="c1" />
        <input type="text" class="hex" id="h1" maxlength="7" spellcheck="false" />
        <span class="until">until <input type="number" id="t2" min="1" step="0.5" /> h</span>
      </div>
      <div class="band">
        <label for="c2"><span class="dot" id="pdot2"></span>Long session</label>
        <input type="color" id="c2" />
        <input type="text" class="hex" id="h2" maxlength="7" spellcheck="false" />
        <span class="until">until <input type="number" id="t3" min="1.5" step="0.5" /> h</span>
      </div>
      <div class="band">
        <label for="c3"><span class="dot" id="pdot3"></span>Marathon</label>
        <input type="color" id="c3" />
        <input type="text" class="hex" id="h3" maxlength="7" spellcheck="false" />
        <span class="until">after that</span>
      </div>
      <div style="display:flex; align-items:center; justify-content:space-between; margin-top:10px;">
        <div style="font-size:11px; color:#adadb8;">Times must go up in order.</div>
        <button id="resetColors" class="secondary" style="width:auto; padding:5px 10px; font-size:11px;">Reset colors</button>
      </div>
      <div id="thresholdError" style="font-size:11px; color:#ff5252; margin-top:4px;"></div>
    </div>
  </div>

  <div class="section" id="setup" style="display:none">
    <button id="connectBtn">Connect Twitch account</button>
  </div>

  <div class="section" id="connectedView" style="display:none">
    <button id="disconnectBtn" class="secondary">Disconnect Twitch account</button>
  </div>

  <div class="section" style="border-bottom:none; padding-top:8px;">
    <div id="status"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
